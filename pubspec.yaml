name: ipuranks
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.2
  shared_preferences_linux: ^2.4.0
  shared_preferences_windows: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/logo.png"
  adaptive_icon_foreground: "assets/app_icon/logo.png"
  adaptive_icon_background: "#000000"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/subject_credits.json
    - assets/app_icon/logo.png